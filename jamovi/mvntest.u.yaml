title: Multivariate Normality Test
name: mvntest
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: 'Variables (min: 2)'
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: ComboBox
        name: mvnTest
      - type: ComboBox
        name: univariateTest
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showDescriptives
  - type: CollapseBox
    label: Outliers
    collapsed: true
    margin: large
    children:
      - type: ComboBox
        name: outlierMethod
      - type: TextBox
        name: outlierAlpha
        format: number
        enable: (outlierMethod:quan || outlierMethod:adj)
  - type: CollapseBox
    label: Data Preparation
    collapsed: true
    margin: large
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: powerFamily
      - type: CheckBox
        name: scale
      - type: ComboBox
        name: impute
  - type: CollapseBox
    label: Bootstrap
    collapsed: true
    margin: large
    children:
      - type: CheckBox
        name: bootstrap
      - type: TextBox
        name: nBoot
        format: number
        enable: (bootstrap || mvnTest:energy)
  - type: CollapseBox
    label: Plots
    collapsed: true
    margin: large
    children:
      - type: CheckBox
        name: showQQPlot
      - type: CheckBox
        name: showUniPlots
      - type: CheckBox
        name: showBoxPlots
      - type: CheckBox
        name: showHistograms
